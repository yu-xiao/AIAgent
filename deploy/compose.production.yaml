name: ai-agent

x-api: &api
  restart: unless-stopped
  env_file:
    - ${AI_AGENT_ENV_FILE:-../.env.production}
  secrets:
    - database_password
    - redis_password
    - model_api_key
    - vault_token
    - audit_integrity_key
  read_only: true
  tmpfs:
    - /tmp:size=64m,mode=1777
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  stop_grace_period: 45s
  deploy:
    resources:
      limits:
        cpus: "2.0"
        memory: 2g
      reservations:
        cpus: "0.25"
        memory: 256m
  healthcheck:
    test:
      - CMD
      - python
      - -c
      - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"
    interval: 10s
    timeout: 5s
    retries: 6
    start_period: 20s
  networks:
    - backend

services:
  migrate:
    image: ${AI_AGENT_IMAGE_BLUE:?set AI_AGENT_IMAGE_BLUE}
    env_file:
      - ${AI_AGENT_ENV_FILE:-../.env.production}
    secrets:
      - database_password
    command: ["alembic", "upgrade", "head"]
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: "no"
    networks:
      - backend

  api-blue:
    <<: *api
    image: ${AI_AGENT_IMAGE_BLUE:?set AI_AGENT_IMAGE_BLUE}
    depends_on:
      migrate:
        condition: service_completed_successfully

  api-green:
    <<: *api
    image: ${AI_AGENT_IMAGE_GREEN:-enterprise-ai-agent:green}
    profiles: ["green"]
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    <<: *api
    image: ${AI_AGENT_WORKER_IMAGE:?set AI_AGENT_WORKER_IMAGE}
    command: ["ai-agent", "worker"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "ai-agent", "worker-health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  proxy:
    image: nginxinc/nginx-unprivileged:1.29-alpine
    restart: unless-stopped
    depends_on:
      api-blue:
        condition: service_healthy
    ports:
      - "443:8443"
    volumes:
      - ./nginx/server.conf:/etc/nginx/conf.d/server.conf:ro
      - ${AI_AGENT_UPSTREAM_CONFIG:-./nginx/upstream-blue.conf}:/etc/nginx/conf.d/upstream.conf:ro
    secrets:
      - tls_certificate
      - tls_private_key
    read_only: true
    tmpfs:
      - /var/cache/nginx:size=64m
      - /var/run:size=8m
      - /tmp:size=16m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - backend

  prometheus:
    image: prom/prometheus:v3.6.0
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=30d
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - backend

  alertmanager:
    image: prom/alertmanager:v0.28.1
    restart: unless-stopped
    command: ["--config.file=/etc/alertmanager/alertmanager.yml"]
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - backend

networks:
  backend:
    driver: bridge

volumes:
  prometheus_data:
  alertmanager_data:

secrets:
  database_password:
    file: ${AI_AGENT_DATABASE_PASSWORD_FILE:?set AI_AGENT_DATABASE_PASSWORD_FILE}
  redis_password:
    file: ${AI_AGENT_REDIS_PASSWORD_FILE:?set AI_AGENT_REDIS_PASSWORD_FILE}
  model_api_key:
    file: ${AI_AGENT_MODEL_API_KEY_FILE:?set AI_AGENT_MODEL_API_KEY_FILE}
  vault_token:
    file: ${AI_AGENT_VAULT_TOKEN_FILE:?set AI_AGENT_VAULT_TOKEN_FILE}
  audit_integrity_key:
    file: ${AI_AGENT_AUDIT_INTEGRITY_KEY_FILE:?set AI_AGENT_AUDIT_INTEGRITY_KEY_FILE}
  tls_certificate:
    file: ${AI_AGENT_TLS_CERTIFICATE_FILE:?set AI_AGENT_TLS_CERTIFICATE_FILE}
  tls_private_key:
    file: ${AI_AGENT_TLS_PRIVATE_KEY_FILE:?set AI_AGENT_TLS_PRIVATE_KEY_FILE}
