name: CI

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: ai_agent_test
          POSTGRES_USER: ai_agent_test
          POSTGRES_PASSWORD: test-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ai_agent_test -d ai_agent_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      AI_AGENT_TEST_POSTGRES_URL: postgresql+asyncpg://ai_agent_test:test-only-password@127.0.0.1:5432/ai_agent_test
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: 0.9.21
          enable-cache: true

      - name: Verify lock file
        run: uv lock --check

      - name: Install locked dependencies
        run: uv sync --frozen

      - name: Run tests
        run: uv run --no-sync pytest

      - name: Run Ruff
        run: uv run --no-sync ruff check .

      - name: Run mypy
        run: uv run --no-sync mypy src/ai_agent

      - name: Verify database migrations
        env:
          AI_AGENT_PLATFORM__DATABASE_URL: sqlite+aiosqlite:////tmp/ai-agent-migrations.db
        run: uv run --no-sync alembic upgrade head

      - name: Validate production Compose
        env:
          AI_AGENT_IMAGE_BLUE: enterprise-ai-agent:ci
          AI_AGENT_WORKER_IMAGE: enterprise-ai-agent:ci
          AI_AGENT_DATABASE_PASSWORD_FILE: /tmp/database-password
          AI_AGENT_REDIS_PASSWORD_FILE: /tmp/redis-password
          AI_AGENT_MODEL_API_KEY_FILE: /tmp/model-api-key
          AI_AGENT_VAULT_TOKEN_FILE: /tmp/vault-token
          AI_AGENT_AUDIT_INTEGRITY_KEY_FILE: /tmp/audit-key
          AI_AGENT_TLS_CERTIFICATE_FILE: /tmp/tls-certificate
          AI_AGENT_TLS_PRIVATE_KEY_FILE: /tmp/tls-private-key
        run: |
          for file in \
            /tmp/database-password \
            /tmp/redis-password \
            /tmp/model-api-key \
            /tmp/vault-token \
            /tmp/audit-key \
            /tmp/tls-certificate \
            /tmp/tls-private-key; do
            printf 'ci-placeholder' > "$file"
            chmod 600 "$file"
          done
          docker compose -f deploy/compose.production.yaml config --quiet

      - name: Check whitespace errors
        run: git diff --check $(git hash-object -t tree /dev/null) HEAD

      - name: Parse PowerShell operational scripts
        shell: bash
        run: |
          pwsh -NoLogo -NoProfile -NonInteractive -Command '
            $errors = @()
            Get-ChildItem -LiteralPath scripts -Filter *.ps1 -File | ForEach-Object {
              $tokens = $null
              $parseErrors = $null
              [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$parseErrors) | Out-Null
              $errors += $parseErrors
            }
            if ($errors.Count -gt 0) {
              $errors | Format-List | Out-Host
              exit 1
            }
          '

      - name: Test backup verification safeguards
        shell: pwsh
        run: ./tests/powershell/verify-backup.Tests.ps1

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Review dependency changes
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0

  container:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Validate production image build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: enterprise-ai-agent:ci
          build-args: |
            VERSION=0.3.0
            VCS_REF=${{ github.sha }}
            BUILD_DATE=${{ github.run_started_at }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
